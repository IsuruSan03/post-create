name: Daily Honest Brit Post

on:
  schedule:
    # All times below assume UK Summer Time (BST = UTC+1). In UK winter (UTC+0), everything
    # here lands ONE HOUR EARLIER in UK local time — shift each cron hour +1 if you want it pinned exactly.

    # Daily baseline evening slot: 16:30 UTC ≈ 5:30 PM UK (every day)
    - cron: "30 16 * * *"

    # Extra evening peak slot on your best days: 18:30 UTC ≈ 7:30 PM UK (Mon=1, Thu=4, Sun=0)
    - cron: "30 18 * * 1,4,0"

    # Sunday morning "papers" slot: 10:00 UTC ≈ 11:00 AM UK (Sunday only)
    - cron: "0 10 * * 0"

  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: node daily_post.js
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
